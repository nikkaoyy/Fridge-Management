<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<meta name="referrer" content="no-referrer">
<title>Nevera</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/estatico/app.css">
<script src="/estatico/app.js" defer></script>
</head>
<body>
<!-- Esta página no trae ningún dato: app.js pide el token, lo valida con GET /miembros/yo y solo entonces pide lo
     demás a la API (mismo origen). Sin JavaScript no hay nada que ver. -->
<header class="barra">
  <h1>Nevera</h1>
  <div id="quien" class="quien" hidden>
    <span id="quien-nombre"></span>
    <button id="salir" type="button" class="boton-texto">Salir</button>
  </div>
</header>

<p id="cargando" class="cargando">Cargando…</p>
<noscript><p class="cargando">Esta pantalla necesita JavaScript.</p></noscript>

<section id="v-token" class="vista" hidden>
  <form id="f-token" class="tarjeta" autocomplete="off" novalidate>
    <h2>Entrar</h2>
    <p class="ayuda">Pega tu token de miembro. Se guarda solo en este dispositivo.</p>
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" required>
    <button type="submit" class="boton-principal">Entrar</button>
    <p id="token-error" class="error" role="alert" hidden></p>
    <button id="reintentar" type="button" class="boton-secundario" hidden>Reintentar con el token guardado</button>
  </form>
</section>

<section id="v-lista" class="vista" hidden>
  <input id="buscar" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre"
         autocomplete="off" enterkeyhint="search">
  <div id="filtros" class="chips" role="group" aria-label="Ubicación"></div>
  <p id="resumen" class="resumen"></p>
  <ul id="lista" class="lista"></ul>
  <p id="vacio" class="vacio" hidden></p>
</section>

<section id="v-alta" class="vista" hidden>
  <form id="f-alta" class="tarjeta" autocomplete="off" novalidate>
    <h2>Agregar</h2>
    <label for="a-nombre">Nombre</label>
    <input id="a-nombre" name="nombre" list="dl-productos" autocapitalize="sentences" enterkeyhint="next" required>
    <p id="a-nombre-ayuda" class="ayuda"></p>
    <label for="a-categoria">Categoría</label>
    <input id="a-categoria" name="categoria" list="dl-categorias" autocapitalize="none" enterkeyhint="next">
    <div class="par">
      <div>
        <label for="a-cantidad">Cantidad</label>
        <input id="a-cantidad" name="cantidad" inputmode="decimal" enterkeyhint="next" value="1" required>
      </div>
      <div>
        <label for="a-unidad">Unidad</label>
        <select id="a-unidad" name="unidad"></select>
      </div>
    </div>
    <label for="a-vence">Vence</label>
    <input id="a-vence" name="vencimiento" type="date">
    <p class="ayuda">Guardar en:</p>
    <div id="a-donde" class="chips" role="radiogroup" aria-label="Dónde se guarda"></div>
    <button id="a-guardar" type="submit" class="boton-principal">Guardar</button>
    <p id="a-msg" class="mensaje" role="status" hidden></p>
  </form>
  <datalist id="dl-productos"></datalist>
  <datalist id="dl-categorias"></datalist>
</section>

<nav id="pie" class="pie" hidden>
  <button id="ir-lista" type="button" aria-current="page">Lista</button>
  <button id="ir-alta" type="button">Agregar</button>
</nav>

<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
</body>
</html>
